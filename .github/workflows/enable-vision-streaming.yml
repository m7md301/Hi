name: Enable vision streaming

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'enable vision streaming') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch analyze_image streaming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          old = 'const body: any = { model, max_tokens: 4096, stream: false, messages:'
          new = 'const body: any = { model, max_tokens: 4096, stream: true, messages:'
          if old not in s:
              raise SystemExit('stream=false marker not found')
          s = s.replace(old, new, 1)
          old_fetch = '''const raw = await resp.text(); let d: any; try { d = JSON.parse(raw); } catch { throw Error(`xKiro returned non-JSON HTTP ${resp.status}`); } if (!resp.ok || d.error) throw Error(`xKiro HTTP ${resp.status}: ${d.error?.message || "request failed"}`); const choice = d.choices?.[0]; const t = textOf(choice?.message?.content ?? d.output_text ?? d.message?.content).trim();'''
          new_fetch = '''if (!resp.ok) { const raw = await resp.text(); let d: any; try { d = JSON.parse(raw); } catch { d = { raw }; } throw Error(`xKiro HTTP ${resp.status}: ${d.error?.message || JSON.stringify(d)}`); } const reader = resp.body?.getReader(); if (!reader) throw Error("xKiro returned no streaming body"); const decoder = new TextDecoder(); let buffer = "", streamed = "", finish_reason: string | undefined; let first_chunk_ms: number | undefined; while (true) { const part = await reader.read(); if (part.done) break; buffer += decoder.decode(part.value, { stream: true }); const lines = buffer.split("\\n"); buffer = lines.pop() || ""; for (const line of lines) { const value = line.trim(); if (!value.startsWith("data:")) continue; const payload = value.slice(5).trim(); if (payload === "[DONE]") continue; let chunk: any; try { chunk = JSON.parse(payload); } catch { continue; } if (chunk.error) throw Error(`xKiro stream error: ${chunk.error.message || JSON.stringify(chunk.error)}`); const delta = textOf(chunk.choices?.[0]?.delta?.content); if (delta) { if (first_chunk_ms === undefined) first_chunk_ms = Date.now() - start; streamed += delta; } finish_reason = chunk.choices?.[0]?.finish_reason || finish_reason; } } buffer += decoder.decode(); const t = streamed.trim(); const choice = { finish_reason };'''
          if old_fetch not in s:
              raise SystemExit('non-stream response parser marker not found')
          s = s.replace(old_fetch, new_fetch, 1)
          old_return = 'return result({ success: true, tool: "analyze_image", model, content_type: src.type, analysis, finish_reason: choice?.finish_reason, elapsed_ms: Date.now() - start, note: "Visual analysis only; no actions executed." });'
          new_return = 'return result({ success: true, tool: "analyze_image", model, content_type: src.type, analysis, finish_reason: choice?.finish_reason, elapsed_ms: Date.now() - start, first_chunk_ms, note: "Visual analysis only; no actions executed." });'
          if old_return not in s:
              raise SystemExit('analysis return marker not found')
          s = s.replace(old_return, new_return, 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'stream: true' src/index.ts
          grep -q 'getReader()' src/index.ts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts
          git commit -m "feat: enable vision streaming"
          git push

name: Wire vision analysis to Workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'wire vision analysis to Workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Worker integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          s = s.replace('interface Env { XKIRO_API_KEY?: string; MCP_ACCESS_TOKEN?: string; UPLOADS?: R2Bucket; COMMIT_SHA?: string }', 'interface Env { XKIRO_API_KEY?: string; MCP_ACCESS_TOKEN?: string; UPLOADS?: R2Bucket; COMMIT_SHA?: string; VISION_ANALYSIS: Workflow<{ jobId: string; image_url?: string; image_base64?: string; prompt?: string; model?: string; response_format?: "text" | "json"; detail?: "low" | "high"; language?: string }> }', 1)
          start = s.index('async function analyze(')
          end = s.index('async function edit(', start)
          fn = '''async function analyze(e: Env, r: Request, a: any) {\n  const id = crypto.randomUUID();\n  await e.VISION_ANALYSIS.create({ id, params: { jobId: id, image_url: a.image_url, image_base64: a.image_base64, prompt: a.prompt, model: a.model, response_format: a.response_format, detail: a.detail, language: a.language } });\n  return result({ success: true, status: "processing", job_id: id, expires_in_minutes: 30, next_step: "Call get_analysis_job with this job_id." });\n}\n'''
          s = s[:start] + fn + s[end:]
          old = 's.registerTool("analyze_image", { description: "Analyze an image or screenshot as a visual-only observer. It never performs actions.", inputSchema: { image_url: z.string().url().optional(), image_base64: z.string().optional(), prompt: z.string().optional(), model: z.string().optional(), response_format: z.enum(["text", "json"]).optional(), detail: z.enum(["low", "high"]).optional(), language: z.string().optional() } }, async a => analyze(e, r, a));'
          new = old.replace('async a => analyze(e, r, a)', 'async a => analyze(e, r, a)')
          if old not in s: raise SystemExit('analyze registration marker missing')
          s = s.replace(old, new, 1)
          marker = 'return s; }'
          add = 's.registerTool("get_analysis_job", { description: "Retrieve a temporary asynchronous vision analysis result. Results expire after 30 minutes.", inputSchema: { job_id: z.string().uuid() } }, async ({ job_id }) => { const o = await e.UPLOADS?.get(`temporary/analysis/${job_id}.json`); if (!o) return result({ success: false, error: "Analysis job not found or expired" }, true); return result(JSON.parse(await o.text())); }); '
          if marker not in s: raise SystemExit('server return marker missing')
          s = s.replace(marker, add + marker, 1)
          s = s.replace('analyze_image: { registered: true, default_model: "qwen/qwen3.8-max:free", deadline_ms: 150000, max_tokens: 4096, streaming: true }', 'analyze_image: { registered: true, default_model: "qwen/qwen3.8-max:free", deadline_ms: 150000, max_tokens: 4096, streaming: true, asynchronous: true, job_ttl_minutes: 30 }', 1)
          p.write_text(s)
          PY
      - name: Typecheck and commit
        run: |
          npm run typecheck
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts
          git commit -m "feat: wire vision analysis to Workflow"
          git push

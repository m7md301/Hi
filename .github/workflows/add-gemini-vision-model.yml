name: Add Gemini vision model

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'add Gemini vision model') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Gemini to vision metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          old = 'const DEFAULT_MODEL = "sensenova/sensenova-u1.5-lite";'
          new = 'const DEFAULT_MODEL = "sensenova/sensenova-u1.5-lite";\nconst VISION_MODELS = ["qwen/qwen3.8-max:free", "google/gemini-3.8-flash"] as const;'
          if old not in s:
              raise SystemExit('DEFAULT_MODEL marker not found')
          s = s.replace(old, new, 1)
          old = 'description: "Analyze an image or screenshot as a visual-only observer. It never performs actions.", inputSchema:'
          new = 'description: "Analyze an image or screenshot as a visual-only observer. It never performs actions. Supported vision model IDs include qwen/qwen3.8-max:free and google/gemini-3.8-flash. The model parameter is optional and defaults to qwen/qwen3.8-max:free.", inputSchema:'
          if old not in s:
              raise SystemExit('analyze description marker not found')
          s = s.replace(old, new, 1)
          old = 'max_tokens: 4096, streaming: true }, upstream_tested: false'
          new = 'max_tokens: 4096, streaming: true, supported_models: VISION_MODELS }, upstream_tested: false'
          if old not in s:
              raise SystemExit('health vision metadata marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Typecheck and commit
        run: |
          npm run typecheck
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts
          git commit -m "feat: add Gemini vision model"
          git push

name: Fix missing upload handler

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: restore upload handler') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore upload handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          if 'async function upload(' not in s:
              marker = 'const worker: ExportedHandler<Env> = {'
              fn = r'''async function upload(r: Request, e: Env, u: URL) {
            if (!e.UPLOADS) return json({ error: "UPLOADS R2 binding is not configured", build: BUILD }, 503);
            if (u.pathname === "/upload" || u.pathname === "/upload/") {
              if (r.method === "GET") return new Response("Temporary upload endpoint", { status: 200, headers: { "Content-Type": "text/plain; charset=utf-8", "Cache-Control": "no-store" } });
              if (r.method !== "POST") return new Response("Method not allowed", { status: 405 });
              const type = (r.headers.get("X-File-Type") || "").toLowerCase();
              if (!IMAGE_TYPES.has(type)) return json({ error: "Unsupported image type" }, 400);
              const b = await r.arrayBuffer();
              if (!b.byteLength || b.byteLength > MAX) return json({ error: "Image must be between 1 byte and 20MB" }, 400);
              const key = `temporary/${crypto.randomUUID()}.${type === "image/jpeg" ? "jpg" : type.split("/")[1]}`;
              const expiresAt = Date.now() + TTL;
              await e.UPLOADS.put(key, b, { httpMetadata: { contentType: type }, customMetadata: { expiresAt: String(expiresAt) } });
              return json({ url: new URL(`/uploads/${key}`, r.url).toString(), expiresAt: new Date(expiresAt).toISOString() });
            }
            if (!u.pathname.startsWith("/uploads/")) return new Response("Not found", { status: 404 });
            if (r.method !== "GET" && r.method !== "HEAD") return new Response("Method not allowed", { status: 405 });
            const key = u.pathname.slice(9), o = await e.UPLOADS.get(key), ex = Number(o?.customMetadata?.expiresAt);
            if (!o || !Number.isFinite(ex) || Date.now() >= ex) return new Response("Not found", { status: 404 });
            return new Response(r.method === "HEAD" ? null : o.body, { headers: { "Content-Type": o.httpMetadata?.contentType || "application/octet-stream", "Cache-Control": "no-store", "Access-Control-Allow-Origin": "*" } });
          }
          '''
              if marker not in s: raise SystemExit('worker marker missing')
              s = s.replace(marker, fn + marker, 1)
              p.write_text(s)
          PY
      - name: Typecheck
        run: |
          npm install --ignore-scripts
          npm run typecheck
      - name: Commit and remove patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts
          git commit -m "fix: restore upload handler"
          git push

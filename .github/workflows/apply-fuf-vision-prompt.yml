name: Sync MCP Skill and Vision Configuration

on:
  push:
    branches:
      - main
    paths:
      - src/index.ts
      - src/skills/create-images.md
      - .github/workflows/apply-fuf-vision-prompt.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate skill module and patch current source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          skill_path = Path('src/skills/create-images.md')
          skill = skill_path.read_text(encoding='utf-8')
          Path('src/skills/create-images.ts').write_text(
              'export const CREATE_IMAGES_SKILL = ' + json.dumps(skill, ensure_ascii=False) + ';\n',
              encoding='utf-8',
          )

          p = Path('src/index.ts')
          s = p.read_text(encoding='utf-8')
          imp = 'import { CREATE_IMAGES_SKILL } from "./skills/create-images";'
          if imp not in s:
              s = imp + '\n' + s

          marker = 's.registerTool("get_upload_slot",'
          registration = 's.registerTool("get_create_images_skill", { description: "Return the complete create-images skill. Call this before generating or editing images and follow its instructions.", inputSchema: {} }, async () => ({ content: [{ type: "text" as const, text: CREATE_IMAGES_SKILL }] })); '
          if 's.registerTool("get_create_images_skill",' not in s:
              if marker not in s:
                  raise SystemExit('Cannot locate MCP tool registration point')
              s = s.replace(marker, registration + marker, 1)

          s = s.replace(
              'description: "Submit an asynchronous image-generation job to xKiro."',
              'description: "Submit an asynchronous image-generation job to xKiro. Call get_create_images_skill first and follow its complete instructions."',
          )
          s = s.replace(
              'description: "Edit an existing HTTPS image URL."',
              'description: "Edit an existing HTTPS image URL. Call get_create_images_skill first and follow its complete instructions."',
          )
          s = s.replace('setTimeout(() => ctl.abort(), 40000)', 'setTimeout(() => ctl.abort(), 150000)')
          s = s.replace('Analysis deadline exceeded (40 seconds)', 'Analysis deadline exceeded (150 seconds)')
          s = s.replace('deadline_ms: 40000', 'deadline_ms: 150000')

          required = [
              imp,
              's.registerTool("get_create_images_skill",',
              'setTimeout(() => ctl.abort(), 150000)',
              'Analysis deadline exceeded (150 seconds)',
              'deadline_ms: 150000',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Verification failed: ' + '; '.join(missing))
          p.write_text(s, encoding='utf-8')
          print('Skill module, MCP tool, descriptions and 150-second deadline verified')
          PY

      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts src/skills/create-images.ts
          if git diff --cached --quiet; then
            echo "No synchronization changes needed"
            exit 0
          fi
          git commit -m "ci: sync MCP skill and vision"
          git push

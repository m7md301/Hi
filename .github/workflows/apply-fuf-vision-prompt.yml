name: Sync MCP Skill and Vision Configuration

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Generate skill module and patch Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate module and apply source changes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          skill_path = Path("src/skills/create-images.md")
          if not skill_path.is_file():
              raise SystemExit("src/skills/create-images.md is missing")
          skill = skill_path.read_text(encoding="utf-8")
          Path("src/skills/create-images.ts").write_text(
              "export const CREATE_IMAGES_SKILL = " + json.dumps(skill, ensure_ascii=False) + ";\n",
              encoding="utf-8",
          )

          path = Path("src/index.ts")
          source = path.read_text(encoding="utf-8")
          import_line = 'import { CREATE_IMAGES_SKILL } from "./skills/create-images";'
          if import_line not in source:
              source = import_line + "\n" + source

          if 's.registerTool("get_create_images_skill",' not in source:
              marker = 's.registerTool("get_upload_slot",'
              tool = 's.registerTool("get_create_images_skill", { description: "Return the complete create-images skill. Call this before generating or editing images and follow its instructions.", inputSchema: {} }, async () => ({ content: [{ type: "text" as const, text: CREATE_IMAGES_SKILL }] })); '
              if marker not in source:
                  raise SystemExit("MCP registration marker is missing")
              source = source.replace(marker, tool + marker, 1)

          source = source.replace(
              'description: "Submit an asynchronous image-generation job to xKiro."',
              'description: "Submit an asynchronous image-generation job to xKiro. Call get_create_images_skill first and follow its complete instructions."',
          )
          source = source.replace(
              'description: "Edit an existing HTTPS image URL."',
              'description: "Edit an existing HTTPS image URL. Call get_create_images_skill first and follow its complete instructions."',
          )
          source = source.replace("setTimeout(() => ctl.abort(), 40000)", "setTimeout(() => ctl.abort(), 150000)")
          source = source.replace("Analysis deadline exceeded (40 seconds)", "Analysis deadline exceeded (150 seconds)")
          source = source.replace("deadline_ms: 40000", "deadline_ms: 150000")

          required = [
              import_line,
              's.registerTool("get_create_images_skill",',
              "setTimeout(() => ctl.abort(), 150000)",
              "Analysis deadline exceeded (150 seconds)",
              "deadline_ms: 150000",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Verification failed: " + "; ".join(missing))
          path.write_text(source, encoding="utf-8")
          print("Skill module, MCP tool, descriptions, and 150-second deadline verified")
          PY

      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts src/skills/create-images.ts
          if git diff --cached --quiet; then
            echo "Already synchronized"
          else
            git commit -m "ci: sync MCP skill and vision"
            git push
          fi

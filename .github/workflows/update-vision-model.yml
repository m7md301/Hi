name: Set vision default model

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'chore: remove temporary vision model updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update default vision model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          old = 'cohere/command-a-plus'
          new = 'qwen/qwen3.8-max:free'
          if old not in s:
              raise SystemExit('current vision default model was not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts
          git commit -m "feat: use qwen3.8 max as default vision model"
          git push

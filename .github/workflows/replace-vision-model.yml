name: Configure vision model description

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  configure-vision:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep Qwen default and improve GLM description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('src/index.ts'), Path('src/vision-workflow.ts')]
          replacements = {
              'const DEFAULT_VISION_MODEL="z-ai/glm-5.3-flash"': 'const DEFAULT_VISION_MODEL="qwen/qwen3.8-max:free"',
              '"z-ai/glm-5.3-flash":"رؤية واستدلال بتكلفة منخفضة؛ تجريبي حتى التحقق من دقته وسرعته"': '"z-ai/glm-5.3-flash":"نموذج يجمع بين القوة والسرعة؛ استخدمه عندما تحتاج دقة عالية مع استجابة سريعة"',
              '"z-ai/glm-5.3-flash":"دقة عالية وسرعة عالية في التحليل البصري"': '"z-ai/glm-5.3-flash":"نموذج يجمع بين القوة والسرعة؛ استخدمه عندما تحتاج دقة عالية مع استجابة سريعة"',
          }
          changed = False
          for path in files:
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed = True
          if not changed:
              print('No source replacement needed')
          PY

      - name: Verify configuration
        run: |
          grep -R 'DEFAULT_VISION_MODEL="qwen/qwen3.8-max:free"' src/index.ts src/vision-workflow.ts
          grep -R 'نموذج يجمع بين القوة والسرعة' src/index.ts src/vision-workflow.ts

      - name: Commit source configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts src/vision-workflow.ts
          git diff --cached --quiet || git commit -m 'vision: keep Qwen default and refine GLM description'
          git push
